<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muser view</title>
<style>
  :root { --bg: #15171c; --panel: #1e2129; --line: #2c313c; --text: #e6e8ee; --dim: #9aa1b2; --accent: #5ac8fa; --warn: #ffb454; --err: #ff6b6b; --ok: #7bd88f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  header { padding: 12px 18px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  .meta { color: var(--dim); }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); }
  .badge.busy { color: var(--warn); border-color: var(--warn); }
  .badge.live { color: var(--ok); border-color: var(--ok); }
  .banner { margin: 10px 18px 0; padding: 8px 12px; border-radius: 6px; display: none; white-space: pre-wrap; }
  .banner.err { display: block; background: #3a1f24; color: var(--err); }
  .banner.info { display: block; background: #2b2a1f; color: var(--warn); }
  .transport { display: flex; gap: 10px; align-items: center; padding: 10px 18px; flex-wrap: wrap; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.on { background: var(--accent); color: #0b1720; border-color: var(--accent); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; min-width: 150px; }
  label.inline { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
  #timeline-wrap { padding: 0 18px; }
  #timeline { width: 100%; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 14px 18px 30px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 14px; color: var(--dim); font-weight: 600; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.name { white-space: nowrap; }
  td.name small { display: block; color: var(--dim); font-size: 12px; }
  tr.bus td.name { color: var(--accent); }
  tr.changed td.name::before { content: "● "; color: var(--warn); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .db { font-variant-numeric: tabular-nums; width: 76px; white-space: nowrap; color: var(--dim); text-align: right; }
  .ms button { padding: 2px 8px; font-size: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  pre { margin: 8px 0 0; padding: 8px; background: #111318; border-radius: 4px; max-height: 240px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  #loading { padding: 40px 18px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1 id="title">muser view</h1>
  <span class="meta" id="meta"></span>
  <span class="badge" id="badge">连接中</span>
</header>
<div class="banner" id="banner" role="status" aria-live="polite"></div>
<div id="loading">引擎渲染中…</div>
<div id="app" hidden>
  <div class="transport">
    <button id="play" aria-label="播放/暂停（空格）">▶ 播放</button>
    <button id="stop" aria-label="回到开头">■</button>
    <span class="time" id="time">0:00.0 / 0:00.0</span>
    <label class="inline"><input type="checkbox" id="loop"> 循环</label>
    <label class="inline">监听音量 <input type="range" id="monitor" min="-40" max="6" step="0.5" value="0" style="width:120px" aria-label="监听音量"> <span class="db" id="monitor-db">0.0 dB</span></label>
  </div>
  <div id="timeline-wrap"><canvas id="timeline" aria-label="时间线：点击跳转"></canvas></div>
  <main>
    <section>
      <h2>混音</h2>
      <table>
        <thead><tr><th>名称</th><th style="width:45%">音量 gain_db</th><th></th><th>静音/独奏</th></tr></thead>
        <tbody id="mixer"></tbody>
      </table>
      <p class="hint">改动交给引擎重新渲染（准确结果，乐器有缓存，通常一两秒），就绪后从当前位置无缝换上。独奏只用于试听，不写进工程。双击推子复位。</p>
    </section>
    <aside class="panel">
      <h2>改动（相对工程文件）</h2>
      <div id="changes-empty" class="hint">还没有改动。</div>
      <pre id="changes" hidden></pre>
      <div class="row">
        <button id="save" class="primary" disabled>保存到工程文件</button>
        <button id="reset" disabled>撤销改动</button>
        <button id="copy">复制改动 JSON</button>
      </div>
      <p class="hint" id="path"></p>
    </aside>
  </main>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const dbToGain = (db) => Math.pow(10, db / 20);
const fmtTime = (s) => { const m = Math.floor(s / 60); return `${m}:${(s - m * 60).toFixed(1).padStart(4, "0")}`; };
const fmtDb = (v) => `${v > 0 ? "+" : ""}${Number(v).toFixed(1)} dB`;

let data = null;              // 最近一次的 /api/state
let version = 0;              // 正在播放的版本
let ctx = null, monitor = null;
// ---------- 分段流式播放 ----------
const LEAD = 2.0;             // 提前缓冲的秒数
let sr = 48000, total = 0;
let playing = false, pausedAt = 0;   // pausedAt：暂停时的帧位置
let entries = [];             // 已排期的分段 { src, from, to, when }
let nextFrame = 0, nextWhen = 0, endWhen = Infinity;
let gen = 0, pumping = false;

function banner(text, kind) { const b = $("banner"); b.className = "banner" + (text ? " " + kind : ""); b.textContent = text || ""; }

function ensureCtx() {
  if (ctx) return;
  try { ctx = new AudioContext({ sampleRate: sr }); } catch (_) { ctx = new AudioContext(); }
  monitor = ctx.createGain(); monitor.gain.value = dbToGain(+$("monitor").value); monitor.connect(ctx.destination);
}
function frameAt(t) {
  for (const e of entries) if (t >= e.when && t < e.when + (e.to - e.from) / sr) return Math.floor(e.from + (t - e.when) * sr);
  return null;
}
function position() {
  if (!playing) return pausedAt;
  const f = frameAt(ctx.currentTime);
  return f === null ? (entries.length ? entries[0].from : nextFrame) : f;
}
function stopAll(at) {
  for (const e of entries) { try { at === undefined ? e.src.stop() : e.src.stop(at); } catch (_) {} }
}
async function fetchChunk(v, from, frames) {
  const res = await fetch(`/api/pcm?v=${v}&from=${from}&frames=${frames}`);
  if (res.status === 410) throw new Error("expired");
  if (!res.ok) throw new Error("读取音频失败");
  const pcm = new Int16Array(await res.arrayBuffer());
  const n = pcm.length / 2;
  const buf = ctx.createBuffer(2, Math.max(1, n), sr);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (let i = 0; i < n; i++) { L[i] = pcm[2 * i] / 32768; R[i] = pcm[2 * i + 1] / 32768; }
  return { buf, n };
}
async function pump() {
  if (pumping) return;
  pumping = true;
  try {
    while (playing && nextWhen - ctx.currentTime < LEAD && nextWhen !== Infinity) {
      const my = gen, v = version, from = nextFrame;
      const frames = Math.min(Math.floor(sr / 2), total - from);
      if (frames <= 0) {
        if ($("loop").checked) { nextFrame = 0; continue; }
        endWhen = nextWhen; nextWhen = Infinity; break;
      }
      let chunk;
      try { chunk = await fetchChunk(v, from, frames); }
      catch (e) { if (e.message === "expired") { await refresh(); continue; } banner(String(e.message), "err"); break; }
      if (my !== gen) continue;            // 期间跳转或换了版本：丢弃
      const src = ctx.createBufferSource();
      src.buffer = chunk.buf; src.connect(monitor);
      const now = ctx.currentTime;
      if (nextWhen < now) { src.start(now, now - nextWhen); } else { src.start(nextWhen); }
      const e = { src, from, to: from + chunk.n, when: nextWhen };
      entries.push(e);
      src.onended = () => { entries = entries.filter((x) => x !== e); };
      nextFrame = from + chunk.n; nextWhen += chunk.n / sr;
    }
  } finally { pumping = false; }
}
function startFrom(frame) {
  ensureCtx(); if (ctx.state === "suspended") ctx.resume();
  gen++; stopAll(); entries = [];
  playing = true; endWhen = Infinity;
  nextFrame = Math.max(0, Math.min(frame, total - 1)); nextWhen = ctx.currentTime + 0.05;
  $("play").textContent = "❚❚ 暂停";
  pump();
}
function pause() {
  pausedAt = position();
  playing = false; gen++; stopAll(); entries = [];
  $("play").textContent = "▶ 播放";
}
function seek(frame) {
  frame = Math.max(0, Math.min(frame, total));
  if (playing) startFrom(frame); else pausedAt = frame;
}
/** 新版本就绪：在 0.12 秒后从同一位置换上新版本的音频。 */
function swapVersion(v) {
  version = v;
  if (!playing) return;
  const cutWhen = ctx.currentTime + 0.12;
  const cut = frameAt(cutWhen);
  if (cut === null) { startFrom(position()); return; }
  gen++;
  for (const e of entries) {
    if (e.when >= cutWhen) { try { e.src.stop(); } catch (_) {} }
    else if (e.when + (e.to - e.from) / sr > cutWhen) { try { e.src.stop(cutWhen); } catch (_) {} }
  }
  entries = entries.filter((e) => e.when < cutWhen);
  nextFrame = cut; nextWhen = cutWhen; endWhen = Infinity;
  pump();
}
setInterval(() => {
  if (!playing) return;
  if (ctx.currentTime >= endWhen) { playing = false; pausedAt = 0; entries = []; $("play").textContent = "▶ 播放"; return; }
  pump();
}, 100);

// ---------- 状态同步 ----------
let dragging = false;
async function refresh() {
  const st = await (await fetch("/api/state")).json();
  if (!st.ready) { banner(st.error ? "渲染失败：\n" + st.error : "", st.error ? "err" : ""); return; }
  const first = !data;
  data = st; sr = st.sample_rate; total = st.frames;
  renderHeader(); renderChanges();
  if (!dragging) renderMixer();
  drawTimeline();
  $("loading").hidden = true; $("app").hidden = false;
  if (first) version = st.version;
  else if (st.version !== version) swapVersion(st.version);
  banner(st.error ? "渲染失败（仍在播放上一版）：\n" + st.error : "", "err");
}
let lastStatus = null;
async function poll() {
  try {
    const s = await (await fetch("/api/status")).json();
    const badge = $("badge");
    badge.textContent = s.rendering ? "渲染中…" : `联动 · 版本 ${s.version}`;
    badge.className = "badge " + (s.rendering ? "busy" : "live");
    if (!data || s.version !== data.version || s.error !== data.error) await refresh();
    lastStatus = s;
  } catch (_) {
    $("badge").textContent = "已断开"; $("badge").className = "badge";
    banner("与 muser 的连接断开了（muser view 是否还在运行？）", "err");
  }
  setTimeout(poll, lastStatus && lastStatus.rendering ? 250 : 800);
}
async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const out = await res.json();
  if (!res.ok) { banner("失败：" + (out.error || res.statusText), "err"); throw new Error(out.error); }
  return out;
}

// ---------- 界面 ----------
function renderHeader() {
  $("title").textContent = data.name || "muser view";
  const tracks = data.nodes.filter((n) => n.kind === "track").length;
  $("meta").textContent = `${data.tempo} BPM · ${data.time_signature} · ${fmtTime(total / sr)} · ${tracks} 轨 · 上次渲染 ${data.render_seconds}s`;
  $("path").textContent = data.project_path;
}
function renderMixer() {
  const tb = $("mixer"); tb.innerHTML = "";
  const changed = new Set(data.changes.map((c) => c.node));
  for (const n of data.nodes) {
    const tr = document.createElement("tr");
    if (n.kind === "bus") tr.classList.add("bus");
    if (changed.has(n.id)) tr.classList.add("changed");
    const sub = n.kind === "track"
      ? `${n.instrument} → ${n.output}${Object.keys(n.sends).length ? " · 发送 " + Object.keys(n.sends).join(", ") : ""}`
      : `总线 → ${n.output}${n.effects.length ? " · " + n.effects.join(" → ") : ""}`;
    tr.innerHTML = `<td class="name"></td><td><input type="range" min="-60" max="12" step="0.5"></td><td class="db"></td>
      <td class="ms"><button class="m" aria-label="静音">M</button> <button class="s" aria-label="独奏">S</button></td>`;
    const nameTd = tr.querySelector(".name");
    nameTd.textContent = n.kind === "bus" ? `[${n.name}]` : n.name;
    const small = document.createElement("small"); small.textContent = sub; nameTd.appendChild(small);
    const range = tr.querySelector("input"), dbTd = tr.querySelector(".db");
    range.value = n.gain_db; range.setAttribute("aria-label", `${n.name} 音量`);
    dbTd.textContent = fmtDb(n.gain_db);
    let timer = null;
    const send = () => post("/api/mix", { changes: [{ node: n.id, gain_db: +range.value }] }).catch(() => {});
    range.addEventListener("pointerdown", () => { dragging = true; });
    range.addEventListener("pointerup", () => { dragging = false; });
    range.addEventListener("input", () => { dbTd.textContent = fmtDb(+range.value); clearTimeout(timer); timer = setTimeout(send, 250); });
    range.addEventListener("dblclick", () => { const f = data.file_values && data.file_values[n.id]; range.value = f ?? 0; range.dispatchEvent(new Event("input")); });
    const mb = tr.querySelector(".m"), sb = tr.querySelector(".s");
    mb.classList.toggle("on", n.muted); sb.classList.toggle("on", n.solo);
    mb.addEventListener("click", () => { mb.classList.toggle("on"); post("/api/mix", { changes: [{ node: n.id, muted: mb.classList.contains("on") }] }).catch(() => {}); });
    sb.title = "只听这一路（试听用，不写入工程）";
    sb.addEventListener("click", () => {
      sb.classList.toggle("on");
      const solo = new Set(data.solo); if (sb.classList.contains("on")) solo.add(n.id); else solo.delete(n.id);
      data.solo = [...solo];
      post("/api/mix", { solo: data.solo }).catch(() => {});
    });
    tb.appendChild(tr);
  }
}
function renderChanges() {
  const list = data.changes;
  $("changes-empty").hidden = list.length > 0; $("changes").hidden = list.length === 0;
  const name = (id) => (data.nodes.find((n) => n.id === id) || {}).name || id;
  $("changes").textContent = list.map((c) => {
    const parts = [];
    if ("gain_db" in c) parts.push(`gain_db → ${c.gain_db}`);
    if ("muted" in c) parts.push(`muted → ${c.muted}`);
    return `${c.node}（${name(c.node)}）: ${parts.join("，")}`;
  }).join("\n");
  $("save").disabled = $("reset").disabled = list.length === 0;
}

// ---------- 时间线 ----------
function drawTimeline() {
  if (!data) return;
  const cv = $("timeline"), dpr = window.devicePixelRatio || 1;
  const tracks = data.nodes.filter((n) => n.kind === "track");
  const rowH = 26, waveH = 56, rulerH = 18, H = rulerH + waveH + tracks.length * rowH + 6;
  const W = cv.clientWidth;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px"; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const secPerBeat = 60 / data.tempo, dur = total / sr;
  const x = (beat) => (beat * secPerBeat) / dur * W;
  g.font = "11px system-ui"; g.textBaseline = "middle";
  const step = Math.max(1, Math.ceil(28 / (x(data.beats_per_bar) || 1)));
  for (let bar = 0; bar * data.beats_per_bar * secPerBeat < dur; bar++) {
    const bx = x(bar * data.beats_per_bar);
    g.fillStyle = bar % step ? "#22262f" : "#2c313c"; g.fillRect(bx, rulerH, 1, H - rulerH);
    if (bar % step === 0) { g.fillStyle = "#9aa1b2"; g.fillText(String(bar + 1), bx + 3, rulerH / 2); }
  }
  const endX = x(data.duration_beats); g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(endX, rulerH, W - endX, H - rulerH);
  const mid = rulerH + waveH / 2, pk = data.peaks;
  g.fillStyle = "#5ac8fa88";
  for (let px = 0; px < W; px++) { const p = pk[Math.floor(px / W * pk.length)] || 0; const h = Math.min(1, p) * (waveH / 2 - 2); g.fillRect(px, mid - h, 1, h * 2 || 1); }
  tracks.forEach((t, i) => {
    const y = rulerH + waveH + i * rowH;
    g.globalAlpha = t.muted ? 0.35 : 1;
    let lo = 127, hi = 0;
    for (const c of t.clips) for (const n of c.notes) { lo = Math.min(lo, n[2]); hi = Math.max(hi, n[2]); }
    const span = Math.max(1, hi - lo);
    for (const c of t.clips) {
      const x0 = x(c.start), x1 = x(c.start + c.length);
      g.fillStyle = "#2f4f6f"; g.fillRect(x0, y + 3, Math.max(1, x1 - x0 - 1), rowH - 6);
      g.fillStyle = "#8fd3ff";
      for (const n of c.notes) {
        if (n[0] >= c.length) continue;
        const nx = x(c.start + n[0]), nw = Math.max(1, x(c.start + Math.min(n[0] + n[1], c.length)) - nx);
        g.fillRect(nx, y + 5 + (1 - (n[2] - lo) / span) * (rowH - 12), nw, 2);
      }
    }
    g.globalAlpha = 1;
    const label = t.name + (t.muted ? "（静音）" : "") + (t.solo ? "（独奏）" : "");
    g.fillStyle = "rgba(21,23,28,.75)"; g.fillRect(2, y + 3, g.measureText(label).width + 6, 14);
    g.fillStyle = "#e6e8ee"; g.fillText(label, 5, y + 10);
  });
  const px = position() / Math.max(1, total) * W;
  g.fillStyle = "#ffb454"; g.fillRect(px, 0, 2, H);
}
function tick() { if (data) { $("time").textContent = `${fmtTime(position() / sr)} / ${fmtTime(total / sr)}`; drawTimeline(); } requestAnimationFrame(tick); }

// ---------- 交互 ----------
$("play").addEventListener("click", () => (playing ? pause() : startFrom(pausedAt)));
$("stop").addEventListener("click", () => { pause(); pausedAt = 0; });
$("monitor").addEventListener("input", (e) => { $("monitor-db").textContent = fmtDb(+e.target.value); if (monitor) monitor.gain.value = dbToGain(+e.target.value); });
$("timeline").addEventListener("click", (e) => { const r = e.currentTarget.getBoundingClientRect(); seek(Math.floor((e.clientX - r.left) / r.width * total)); });
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !["INPUT", "BUTTON"].includes(document.activeElement.tagName)) { e.preventDefault(); playing ? pause() : startFrom(pausedAt); }
});
window.addEventListener("resize", drawTimeline);
$("save").addEventListener("click", async () => { await post("/api/save"); banner("已保存到工程文件", "info"); await refresh(); });
$("reset").addEventListener("click", () => post("/api/reset").catch(() => {}));
$("copy").addEventListener("click", async () => {
  const text = JSON.stringify({ changes: data.changes }, null, 2);
  try { await navigator.clipboard.writeText(text); $("copy").textContent = "已复制"; } catch (_) { prompt("复制下面的 JSON：", text); }
  setTimeout(() => ($("copy").textContent = "复制改动 JSON"), 1500);
});
poll();
requestAnimationFrame(tick);
</script>
</body>
</html>
