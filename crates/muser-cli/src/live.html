<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muser live</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080a11; --panel: rgba(18, 22, 35, .88); --line: #262c40; --text: #f3f5fb; --dim: #8d95aa; --faint: #5c6479;
    --accent: #72e5c2; --accent-2: #8a7dff; --warn: #ffc46b; --err: #ff7c8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); background: radial-gradient(circle at 12% -10%, rgba(138,125,255,.13), transparent 30rem), var(--bg);
    font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 28px 28px 40px; }
  .brand { color: var(--faint); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .brand span { color: var(--accent); }
  h1 { margin: 6px 0 0; font-size: 34px; line-height: 1.15; letter-spacing: -.01em; min-height: 40px;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel { margin-top: 18px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  /* 变奏提示：高度固定，内容多少不影响下面 */
  #notice { height: 108px; overflow: hidden; position: relative; }
  #now { font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #now b { color: var(--accent); }
  #now-note { margin-top: 2px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next { margin-top: 6px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #notice.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(114,229,194,.35); } 100% { border-color: var(--line); box-shadow: none; } }
  #ended { display: none; height: 108px; padding: 18px; border: 1px solid var(--accent); border-radius: 16px; color: var(--accent); font-size: 18px; margin-top: 18px; }
  canvas { display: block; width: 100%; }
  .hint { margin-top: 10px; color: var(--faint); font-size: 12px; }
  /* 状态栏：每一格位置、宽度固定，不换行 */
  #status { display: grid; grid-template-columns: 210px 170px 210px 90px 1fr auto; gap: 10px; align-items: center; height: 56px; }
  .cell { height: 32px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px; color: var(--dim);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell b { color: var(--text); font-weight: 600; }
  .cell.loop { color: #07130f; background: var(--accent-2); border-color: var(--accent-2); }
  .cell.warn { color: #1b1203; background: var(--warn); border-color: var(--warn); }
  .cell.err { color: #1b0306; background: var(--err); border-color: var(--err); }
  .cell.empty { border-color: transparent; }
  button { height: 32px; padding: 0 14px; color: var(--text); background: #171b29; border: 1px solid #343c55; border-radius: 9px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--err); color: var(--err); }
</style>
</head>
<body>
<main>
  <div class="brand">muser <span>live</span></div>
  <h1 id="title">muser live</h1>
  <div class="panel" id="notice"><div id="now">—</div><div id="now-note"></div><div id="next"></div></div>
  <div id="ended"></div>
  <div class="panel"><canvas id="tl" height="320"></canvas><div class="hint" id="legend"></div></div>
  <div class="panel" id="status">
    <div class="cell" id="c-bar">—</div><div class="cell" id="c-loop"></div><div class="cell" id="c-auto"></div>
    <div class="cell" id="c-bpm"></div><div class="cell" id="c-info"></div><button id="stop"></button>
  </div>
</main>
<script>
const zh = (navigator.language || "").toLowerCase().startsWith("zh");
const T = zh ? {
  now: (n) => `现在 ▶ <b>${n}</b>`, next: (n, b, s) => `下一段：${n} · 第 ${b} 小节 · ${s} 秒后`, noNext: "之后：循环这一段，直到下一个指令",
  repeat: "（循环）", bar: (b, m) => `第 <b>${b}</b> 小节 · ${m}`, looping: (n) => `循环中 · 第 ${n + 1} 遍`, queued: (s) => `排好 ${s} 秒`,
  autoplay: (s) => `自主演奏还剩 ${s}`, autoplayOver: "自主演奏结束", autoplayOff: "自主演奏：不限时",
  dropouts: (n) => `掉帧 ${n}`, load: (n, c) => `最耗：${n}（${Math.round(c * 100)}% 核）`,
  gone: "连不上 muser live（已经停了？）", master: "主输出", stop: "停止演奏", confirmStop: "停止这场演奏？（录音会写好）",
  ended: (f) => `演奏结束了。${f ? `录音存在 ${f}` : ""}`, endedAway: "演奏结束了（muser live 已经退出）。",
  legend: "上面一行是每一段（浅色 = 循环出来的重复），下面每条轨在哪些段里演奏，右边是电平。白线是正在听到的位置，虚线是排到哪里。",
} : {
  now: (n) => `Now ▶ <b>${n}</b>`, next: (n, b, s) => `Next: ${n} · bar ${b} · in ${s}s`, noNext: "Then: this section loops until the next instruction",
  repeat: " (loop)", bar: (b, m) => `Bar <b>${b}</b> · ${m}`, looping: (n) => `Looping · pass ${n + 1}`, queued: (s) => `${s}s queued`,
  autoplay: (s) => `Autoplay ${s} left`, autoplayOver: "Autoplay over", autoplayOff: "Autoplay: no limit",
  dropouts: (n) => `${n} dropouts`, load: (n, c) => `Heaviest: ${n} (${Math.round(c * 100)}% of a core)`,
  gone: "Can't reach muser live (stopped?)", master: "Master", stop: "Stop", confirmStop: "Stop this session? (the recording will be saved)",
  ended: (f) => `The session is over.${f ? ` Recording: ${f}` : ""}`, endedAway: "The session is over (muser live has exited).",
  legend: "Top row: each section (lighter = loop repeats); below, where each track plays; levels on the right. The white line is what you hear, the dashed one how far it is queued.",
};
document.documentElement.lang = zh ? "zh" : "en";
const $ = (id) => document.getElementById(id);
$("legend").textContent = T.legend;
$("stop").textContent = T.stop;
let view = null, at = 0, over = false, lastSeg = null;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => { s = Math.max(0, Math.round(s)); return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${s}s`; };
$("stop").onclick = async () => {
  if (over || !confirm(T.confirmStop)) return;
  try { await fetch("/api/stop", { method: "POST" }); } catch (_) {}
};
function end(text) {
  over = true;
  $("notice").style.display = "none";
  const e = $("ended"); e.textContent = text; e.style.display = "block";
  $("stop").style.visibility = "hidden";
}
async function poll() {
  try {
    const r = await fetch("/api/view", { cache: "no-store" });
    view = await r.json(); at = performance.now();
    if (view.stopped) return end(T.ended(view.record));
    render();
  } catch (_) {
    if (view) return end(T.endedAway);
    $("c-info").textContent = T.gone; $("c-info").className = "cell err";
  }
  setTimeout(poll, 150);
}
function cell(id, html, cls) { const c = $(id); c.innerHTML = html; c.className = "cell " + (cls || ""); }
function render() {
  const v = view, seg = v.segment;
  if (v.title && $("title").textContent !== v.title) { $("title").textContent = v.title; document.title = `${v.title} · muser live`; }
  // 变奏提示：换到新的一段（不是循环的重复）时闪一下。
  const name = seg.name || `#${seg.index}`;
  $("now").innerHTML = T.now(esc(name)) + (seg.repeat ? esc(T.repeat) : "");
  $("now-note").textContent = seg.note || "";
  $("next").textContent = v.next ? T.next(v.next.name || "…", v.next.bar, Math.round(v.next.starts_in_seconds)) + (v.next.note ? ` — ${v.next.note}` : "") : T.noNext;
  if (!seg.repeat && lastSeg !== null && lastSeg !== seg.index) {
    const n = $("notice"); n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash");
  }
  if (!seg.repeat) lastSeg = seg.index;
  cell("c-bar", T.bar(v.bar, `${v.time_signature[0]}/${v.time_signature[1]}`));
  cell("c-loop", v.looping ? T.looping(v.loop.repeats_played) : T.queued(v.runway_seconds.toFixed(1)), v.looping ? "loop" : "");
  const a = v.autoplay_seconds_left;
  cell("c-auto", a == null ? T.autoplayOff : a > 0 ? T.autoplay(fmt(a)) : T.autoplayOver, a != null && a <= 0 ? "warn" : "");
  cell("c-bpm", `${Math.round(v.tempo)} BPM`);
  const h = v.load && v.load.heaviest && v.load.heaviest[0];
  if (v.error) cell("c-info", esc(v.error), "err");
  else if (v.warning) cell("c-info", esc(v.warning), "warn");
  else if (v.underruns) cell("c-info", T.dropouts(v.underruns) + (h ? ` · ${T.load(esc(h.name), h.cores)}` : ""), "");
  else cell("c-info", h && h.cores > 0.05 ? T.load(esc(h.name), h.cores) : "", h && h.cores > 0.05 ? "" : "empty");
}

function draw() {
  if (over) return;
  requestAnimationFrame(draw);
  if (!view) return;
  const cv = $("tl"), dpr = window.devicePixelRatio || 1;
  const tracks = view.tracks.map((t) => t.name);
  const rowH = 26, top = 38, H = top + rowH * (tracks.length + 1) + 12;
  const W = cv.clientWidth;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px"; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const now = view.position + (performance.now() - at) / 1000;
  const labelW = 110, meterW = 70, x0 = labelW, x1 = W - meterW - 10;
  const span = 60, from = now - span * 0.3, px = (x1 - x0) / span;
  const X = (s) => x0 + (s - from) * px;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const accent = css("--accent"), accent2 = css("--accent-2"), dim = css("--dim"), faint = css("--faint"), line = css("--line");
  g.font = "12px ui-sans-serif, system-ui, sans-serif"; g.textBaseline = "middle";
  for (const s of view.timeline.segments) {
    if (s.end < from || s.start > from + span) continue;
    const a = Math.max(x0, X(s.start)), b = Math.min(x1, X(s.end));
    if (b <= a) continue;
    g.fillStyle = s.repeat ? "rgba(138,125,255,.18)" : "rgba(114,229,194,.22)";
    g.fillRect(a, 6, b - a - 2, 24);
    g.fillStyle = s.repeat ? accent2 : accent;
    const label = `${s.bar}${s.meter[0] !== 4 || s.meter[1] !== 4 ? ` · ${s.meter[0]}/${s.meter[1]}` : ""}${!s.repeat && s.name ? ` · ${s.name}` : ""}`;
    if (b - a > 36) { g.save(); g.beginPath(); g.rect(a, 6, b - a - 4, 24); g.clip(); g.fillText(label, a + 6, 18); g.restore(); }
    tracks.forEach((name, i) => {
      if (!s.tracks.includes(name)) return;
      g.fillStyle = s.repeat ? "rgba(138,125,255,.32)" : "rgba(114,229,194,.45)";
      g.fillRect(a, top + i * rowH + 5, b - a - 2, rowH - 10);
    });
  }
  const levels = Object.fromEntries((view.levels || []).map(([n, p]) => [n, p]));
  [...tracks, ""].forEach((name, i) => {
    const y = top + i * rowH;
    g.strokeStyle = line; g.beginPath(); g.moveTo(0, y + rowH - .5); g.lineTo(W, y + rowH - .5); g.stroke();
    g.fillStyle = name ? dim : faint; g.fillText(name || T.master, 8, y + rowH / 2, labelW - 14);
    const p = levels[name] || 0, db = p > 0 ? 20 * Math.log10(p) : -90, w = Math.max(0, Math.min(1, (db + 60) / 60)) * meterW;
    g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(W - meterW - 4, y + 8, meterW, rowH - 16);
    g.fillStyle = db > -1 ? css("--err") : db > -9 ? css("--warn") : accent; g.fillRect(W - meterW - 4, y + 8, w, rowH - 16);
  });
  const q = X(view.timeline.queued_until);
  if (q > x0 && q < x1) { g.strokeStyle = accent; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(q, 4); g.lineTo(q, H - 8); g.stroke(); g.setLineDash([]); }
  const n = X(now);
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.beginPath(); g.moveTo(n, 2); g.lineTo(n, H - 6); g.stroke(); g.lineWidth = 1;
}
poll(); draw();
</script>
</body>
</html>
