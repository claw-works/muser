<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muser live</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2222 6 212 212%22%3E %3Cdefs%3E %3ClinearGradient id=%22shell%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23ff8f7a%22/%3E%3Cstop offset=%221%22 stop-color=%22%23e5533f%22/%3E%3C/linearGradient%3E %3ClinearGradient id=%22bg%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23151a2b%22/%3E%3Cstop offset=%221%22 stop-color=%22%230b0e17%22/%3E%3C/linearGradient%3E %3C/defs%3E %3Crect x=%2222%22 y=%226%22 width=%22212%22 height=%22212%22 rx=%2248%22 fill=%22url(%23bg)%22/%3E %3Cg stroke=%22%23e5533f%22 stroke-width=%2211%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 fill=%22none%22%3E %3Cpath d=%22M82 122 L62 114 L55 94%22/%3E %3Cpath d=%22M174 122 L194 114 L201 94%22/%3E %3C/g%3E %3Cg fill=%22%2372e5c2%22%3E%3Ccircle cx=%2262%22 cy=%22114%22 r=%225.5%22/%3E%3Ccircle cx=%22194%22 cy=%22114%22 r=%225.5%22/%3E%3C/g%3E %3Cg fill=%22url(%23shell)%22 stroke=%22%23c9432f%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22%3E %3Cpath transform=%22translate(54 92) rotate(-26) scale(0.88)%22 d=%22M -18 2 C -30 -16, -28 -48, -6 -64 C -10 -54, -8 -42, -1 -31 L 3 -30 C 9 -38, 13 -48, 11 -60 C 30 -44, 27 -16, 16 2 Q -1 10 -18 2 Z%22/%3E %3Cpath transform=%22translate(202 92) rotate(26) scale(0.88)%22 d=%22M -18 2 C -30 -16, -28 -48, -6 -64 C -10 -54, -8 -42, -1 -31 L 3 -30 C 9 -38, 13 -48, 11 -60 C 30 -44, 27 -16, 16 2 Q -1 10 -18 2 Z%22/%3E %3C/g%3E %3Cg stroke=%22%23e5533f%22 stroke-width=%227%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M108 98 V70%22/%3E%3Cpath d=%22M148 98 V70%22/%3E%3C/g%3E %3Ccircle cx=%22108%22 cy=%2262%22 r=%2213%22 fill=%22%230b0e17%22 stroke=%22%23e5533f%22 stroke-width=%225%22/%3E%3Ccircle cx=%22148%22 cy=%2262%22 r=%2213%22 fill=%22%230b0e17%22 stroke=%22%23e5533f%22 stroke-width=%225%22/%3E %3Ccircle cx=%22108%22 cy=%2262%22 r=%226%22 fill=%22%2372e5c2%22/%3E%3Ccircle cx=%22148%22 cy=%2262%22 r=%226%22 fill=%22%2372e5c2%22/%3E %3Crect x=%2274%22 y=%2296%22 width=%22108%22 height=%2278%22 rx=%2230%22 fill=%22url(%23shell)%22/%3E %3Crect x=%2292%22 y=%22112%22 width=%2272%22 height=%2244%22 rx=%2212%22 fill=%22%230b0e17%22/%3E %3Cg fill=%22none%22 stroke=%22%2372e5c2%22 stroke-width=%224.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E %3Cpath d=%22M110 118 Q102 118 102 125 V129 Q102 134 97 134 Q102 134 102 139 V143 Q102 150 110 150%22/%3E %3Cpath d=%22M146 118 Q154 118 154 125 V129 Q154 134 159 134 Q154 134 154 139 V143 Q154 150 146 150%22/%3E %3C/g%3E %3Cellipse cx=%22124%22 cy=%22143%22 rx=%227%22 ry=%225.2%22 transform=%22rotate(-20 124 143)%22 fill=%22%2372e5c2%22/%3E %3Cpath d=%22M130 141 V120 Q138 124 140 132%22 fill=%22none%22 stroke=%22%2372e5c2%22 stroke-width=%223.6%22 stroke-linecap=%22round%22/%3E %3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #080a11; --panel: rgba(18, 22, 35, .88); --line: #262c40; --text: #f3f5fb; --dim: #8d95aa; --faint: #5c6479;
    --accent: #72e5c2; --accent-2: #8a7dff; --warn: #ffc46b; --err: #ff7c8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); background: radial-gradient(circle at 12% -10%, rgba(138,125,255,.13), transparent 30rem), var(--bg);
    font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 28px 28px 40px; }
  .brand { color: var(--faint); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .brand span { color: var(--accent); }
  .brand .logo { width: 22px; height: 22px; vertical-align: -6px; margin-right: 8px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  #language { height: 26px; padding: 0 10px; font-size: 12px; color: var(--dim); }
  #language:hover { border-color: var(--accent); color: var(--accent); }
  h1 { margin: 6px 0 0; font-size: 34px; line-height: 1.15; letter-spacing: -.01em; min-height: 40px;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel { margin-top: 18px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
  /* 变奏提示：高度固定，内容多少不影响下面 */
  #notice { height: 108px; overflow: hidden; position: relative; }
  #now { font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #now b { color: var(--accent); }
  #now-note { margin-top: 2px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next { margin-top: 6px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #notice.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(114,229,194,.35); } 100% { border-color: var(--line); box-shadow: none; } }
  /* 卡拉 OK 大字幕：出现过一次就一直占着位置（不跳） */
  #karaoke { display: none; height: 150px; text-align: center; overflow: hidden; }
  #k-cue { height: 22px; color: var(--warn); font-weight: 600; letter-spacing: .08em; }
  #k-now { font-size: 46px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--faint); }
  #k-now .sung { color: var(--accent); }
  #k-now .singing { color: #fff; text-shadow: 0 0 18px rgba(114,229,194,.8); }
  #k-next { margin-top: 6px; font-size: 22px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ended { display: none; height: 108px; padding: 18px; border: 1px solid var(--accent); border-radius: 16px; color: var(--accent); font-size: 18px; margin-top: 18px; }
  canvas { display: block; width: 100%; }
  /* 标题、提示、段落标尺一直在上面；轨道多了只滚动轨道那几行 */
  #head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-bottom: 2px; }
  #rows { max-height: 46vh; overflow-y: auto; overscroll-behavior: contain; }
  .hint { margin-top: 10px; color: var(--faint); font-size: 12px; }
  /* 状态栏：每一格位置、宽度固定，不换行 */
  #status { display: grid; grid-template-columns: 210px 170px 210px 90px 1fr auto; gap: 10px; align-items: center; height: 56px; }
  .cell { height: 32px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px; color: var(--dim);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell b { color: var(--text); font-weight: 600; }
  .cell.loop { color: #07130f; background: var(--accent-2); border-color: var(--accent-2); }
  .cell.warn { color: #1b1203; background: var(--warn); border-color: var(--warn); }
  .cell.err { color: #1b0306; background: var(--err); border-color: var(--err); }
  .cell.empty { border-color: transparent; }
  button { height: 32px; padding: 0 14px; color: var(--text); background: #171b29; border: 1px solid #343c55; border-radius: 9px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--err); color: var(--err); }
</style>
</head>
<body>
<main>
  <div id="head">
    <div class="top"><div class="brand"><img class="logo" alt="muser" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2222 6 212 212%22%3E %3Cdefs%3E %3ClinearGradient id=%22shell%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23ff8f7a%22/%3E%3Cstop offset=%221%22 stop-color=%22%23e5533f%22/%3E%3C/linearGradient%3E %3ClinearGradient id=%22bg%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23151a2b%22/%3E%3Cstop offset=%221%22 stop-color=%22%230b0e17%22/%3E%3C/linearGradient%3E %3C/defs%3E %3Crect x=%2222%22 y=%226%22 width=%22212%22 height=%22212%22 rx=%2248%22 fill=%22url(%23bg)%22/%3E %3Cg stroke=%22%23e5533f%22 stroke-width=%2211%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 fill=%22none%22%3E %3Cpath d=%22M82 122 L62 114 L55 94%22/%3E %3Cpath d=%22M174 122 L194 114 L201 94%22/%3E %3C/g%3E %3Cg fill=%22%2372e5c2%22%3E%3Ccircle cx=%2262%22 cy=%22114%22 r=%225.5%22/%3E%3Ccircle cx=%22194%22 cy=%22114%22 r=%225.5%22/%3E%3C/g%3E %3Cg fill=%22url(%23shell)%22 stroke=%22%23c9432f%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22%3E %3Cpath transform=%22translate(54 92) rotate(-26) scale(0.88)%22 d=%22M -18 2 C -30 -16, -28 -48, -6 -64 C -10 -54, -8 -42, -1 -31 L 3 -30 C 9 -38, 13 -48, 11 -60 C 30 -44, 27 -16, 16 2 Q -1 10 -18 2 Z%22/%3E %3Cpath transform=%22translate(202 92) rotate(26) scale(0.88)%22 d=%22M -18 2 C -30 -16, -28 -48, -6 -64 C -10 -54, -8 -42, -1 -31 L 3 -30 C 9 -38, 13 -48, 11 -60 C 30 -44, 27 -16, 16 2 Q -1 10 -18 2 Z%22/%3E %3C/g%3E %3Cg stroke=%22%23e5533f%22 stroke-width=%227%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M108 98 V70%22/%3E%3Cpath d=%22M148 98 V70%22/%3E%3C/g%3E %3Ccircle cx=%22108%22 cy=%2262%22 r=%2213%22 fill=%22%230b0e17%22 stroke=%22%23e5533f%22 stroke-width=%225%22/%3E%3Ccircle cx=%22148%22 cy=%2262%22 r=%2213%22 fill=%22%230b0e17%22 stroke=%22%23e5533f%22 stroke-width=%225%22/%3E %3Ccircle cx=%22108%22 cy=%2262%22 r=%226%22 fill=%22%2372e5c2%22/%3E%3Ccircle cx=%22148%22 cy=%2262%22 r=%226%22 fill=%22%2372e5c2%22/%3E %3Crect x=%2274%22 y=%2296%22 width=%22108%22 height=%2278%22 rx=%2230%22 fill=%22url(%23shell)%22/%3E %3Crect x=%2292%22 y=%22112%22 width=%2272%22 height=%2244%22 rx=%2212%22 fill=%22%230b0e17%22/%3E %3Cg fill=%22none%22 stroke=%22%2372e5c2%22 stroke-width=%224.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E %3Cpath d=%22M110 118 Q102 118 102 125 V129 Q102 134 97 134 Q102 134 102 139 V143 Q102 150 110 150%22/%3E %3Cpath d=%22M146 118 Q154 118 154 125 V129 Q154 134 159 134 Q154 134 154 139 V143 Q154 150 146 150%22/%3E %3C/g%3E %3Cellipse cx=%22124%22 cy=%22143%22 rx=%227%22 ry=%225.2%22 transform=%22rotate(-20 124 143)%22 fill=%22%2372e5c2%22/%3E %3Cpath d=%22M130 141 V120 Q138 124 140 132%22 fill=%22none%22 stroke=%22%2372e5c2%22 stroke-width=%223.6%22 stroke-linecap=%22round%22/%3E %3C/svg%3E">muser <span>live</span></div><button id="language" type="button"></button></div>
    <h1 id="title">muser live</h1>
    <div class="panel" id="notice"><div id="now">—</div><div id="now-note"></div><div id="next"></div></div>
    <div id="ended"></div>
  </div>
  <div class="panel" id="karaoke"><div id="k-cue"></div><div id="k-now"></div><div id="k-next"></div></div>
  <div class="panel"><canvas id="ruler" height="38"></canvas><div id="rows"><canvas id="tl" height="320"></canvas></div><div class="hint" id="legend"></div></div>
  <div class="panel" id="status">
    <div class="cell" id="c-bar">—</div><div class="cell" id="c-loop"></div><div class="cell" id="c-auto"></div>
    <div class="cell" id="c-bpm"></div><div class="cell" id="c-info"></div><button id="stop"></button>
  </div>
</main>
<script>
// 语言：页面右上角切换，记在本机；没选过就跟浏览器。
let lang = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
try { const l = localStorage.getItem("muser-language"); if (l === "zh" || l === "en") lang = l; } catch (_) {}
const I18N = { zh: {
  now: (n) => `现在 ▶ <b>${n}</b>`, next: (n, b, s) => `下一段：${n} · 第 ${b} 小节 · ${s} 秒后`, noNext: "之后：循环这一段，直到下一个指令",
  repeat: "（循环）", bar: (b, m) => `第 <b>${b}</b> 小节 · ${m}`, looping: (n) => `循环中 · 第 ${n + 1} 遍`, queued: (s) => `排好 ${s} 秒`,
  autoplay: (s) => `自主演奏还剩 ${s}`, autoplayOver: "自主演奏结束", autoplayOff: "自主演奏：不限时",
  dropouts: (n) => `掉帧 ${n}`, recentDropouts: (names) => `最近掉过帧（电脑跟不上）${names ? `：最耗资源的是 ${names}` : ""}`, load: (n, c) => `最耗：${n}（${Math.round(c * 100)}% 核）`,
  gone: "连不上 muser live（已经停了？）", master: "主输出", stop: "停止演奏", confirmStop: "停止这场演奏？（录音会写好）",
  ready: "▶ 准备", ended: (f) => `演奏结束了。${f ? `录音存在 ${f}` : ""}`, endedAway: "演奏结束了（muser live 已经退出）。",
  legend: "上面一行是每一段（浅色 = 循环出来的重复），下面是主输出和每条轨在哪些段里演奏（这一屏里在演奏的排在前面，轨多了可以滚动），右边是电平。白线是正在听到的位置，虚线是排到哪里。",
  switchTo: "EN", switchLabel: "Switch to English", sep: "、",
}, en: {
  now: (n) => `Now ▶ <b>${n}</b>`, next: (n, b, s) => `Next: ${n} · bar ${b} · in ${s}s`, noNext: "Then: this section loops until the next instruction",
  repeat: " (loop)", bar: (b, m) => `Bar <b>${b}</b> · ${m}`, looping: (n) => `Looping · pass ${n + 1}`, queued: (s) => `${s}s queued`,
  autoplay: (s) => `Autoplay ${s} left`, autoplayOver: "Autoplay over", autoplayOff: "Autoplay: no limit",
  dropouts: (n) => `${n} dropouts`, recentDropouts: (names) => `Recent dropouts (the computer can't keep up)${names ? `: heaviest are ${names}` : ""}`, load: (n, c) => `Heaviest: ${n} (${Math.round(c * 100)}% of a core)`,
  gone: "Can't reach muser live (stopped?)", master: "Master", stop: "Stop", confirmStop: "Stop this session? (the recording will be saved)",
  ready: "▶ Get ready", ended: (f) => `The session is over.${f ? ` Recording: ${f}` : ""}`, endedAway: "The session is over (muser live has exited).",
  legend: "Top row: each section (lighter = loop repeats); below, the master and where each track plays (tracks playing on screen come first; scroll when there are many); levels on the right. The white line is what you hear, the dashed one how far it is queued.",
  switchTo: "中文", switchLabel: "切换到中文", sep: ", ",
} };
let T = I18N[lang];
const $ = (id) => document.getElementById(id);
let endedText = null;
function applyLanguage() {
  T = I18N[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  $("legend").textContent = T.legend;
  $("stop").textContent = T.stop;
  $("language").textContent = T.switchTo;
  $("language").setAttribute("aria-label", T.switchLabel);
  if (endedText) $("ended").textContent = endedText();
  if (view && !over) render();
}
$("language").onclick = () => {
  lang = lang === "zh" ? "en" : "zh";
  try { localStorage.setItem("muser-language", lang); } catch (_) {}
  applyLanguage();
};
let view = null, at = 0, over = false, lastSeg = null;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => { s = Math.max(0, Math.round(s)); return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${s}s`; };
$("stop").onclick = async () => {
  if (over || !confirm(T.confirmStop)) return;
  try { await fetch("/api/stop", { method: "POST" }); } catch (_) {}
};
function end(text) {
  over = true;
  endedText = text;
  $("notice").style.display = "none";
  const e = $("ended"); e.textContent = text(); e.style.display = "block";
  $("stop").style.visibility = "hidden";
}
async function poll() {
  try {
    const r = await fetch("/api/view", { cache: "no-store" });
    view = await r.json(); at = performance.now();
    if (view.stopped) { const f = view.record; return end(() => T.ended(f)); }
    render();
  } catch (_) {
    if (view) return end(() => T.endedAway);
    $("c-info").textContent = T.gone; $("c-info").className = "cell err";
  }
  setTimeout(poll, 150);
}
function cell(id, html, cls) { const c = $(id); c.innerHTML = html; c.className = "cell " + (cls || ""); }
function render() {
  const v = view, seg = v.segment;
  if (v.title && $("title").textContent !== v.title) { $("title").textContent = v.title; document.title = `${v.title} · muser live`; }
  // 变奏提示：换到新的一段（不是循环的重复）时闪一下。
  const name = seg.name || `#${seg.index}`;
  $("now").innerHTML = T.now(esc(name)) + (seg.repeat ? esc(T.repeat) : "");
  $("now-note").textContent = seg.note || "";
  $("next").textContent = v.next ? T.next(v.next.name || "…", v.next.bar, Math.round(v.next.starts_in_seconds)) + (v.next.note ? ` — ${v.next.note}` : "") : T.noNext;
  if (!seg.repeat && lastSeg !== null && lastSeg !== seg.index) {
    const n = $("notice"); n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash");
  }
  if (!seg.repeat) lastSeg = seg.index;
  cell("c-bar", T.bar(v.bar, `${v.time_signature[0]}/${v.time_signature[1]}`));
  cell("c-loop", v.looping ? T.looping(v.loop.repeats_played) : T.queued(v.runway_seconds.toFixed(1)), v.looping ? "loop" : "");
  const a = v.autoplay_seconds_left;
  cell("c-auto", a == null ? T.autoplayOff : a > 0 ? T.autoplay(fmt(a)) : T.autoplayOver, a != null && a <= 0 ? "warn" : "");
  cell("c-bpm", `${Math.round(v.tempo)} BPM`);
  const h = v.load && v.load.heaviest && v.load.heaviest[0];
  if (v.error) cell("c-info", esc(v.error), "err");
  else if (v.warning) cell("c-info", esc(T.recentDropouts(((v.load && v.load.heaviest) || []).map((x) => x.name).join(T.sep))), "warn");
  else if (v.underruns) cell("c-info", T.dropouts(v.underruns) + (h ? ` · ${T.load(esc(h.name), h.cores)}` : ""), "");
  else cell("c-info", h && h.cores > 0.05 ? T.load(esc(h.name), h.cores) : "", h && h.cores > 0.05 ? "" : "empty");
}

// 卡拉 OK：时间线上附近各段的字幕，按现在听到的时间高亮。
let karaokeShown = false;
function karaoke() {
  if (!view || over) return;
  const now = view.position + (performance.now() - at) / 1000;
  const lines = view.timeline.segments.flatMap((s) => s.karaoke || []).sort((a, b) => a.start - b.start);
  if (!lines.length && !karaokeShown) return;
  if (lines.length && !karaokeShown) { karaokeShown = true; $("karaoke").style.display = "block"; }
  // 当前这一句：正在唱的，或者 2 秒内就要开始的。
  let i = lines.findIndex((l) => now < l.end + 0.3);
  const cur = i >= 0 && lines[i].start - now < 2.0 ? lines[i] : null;
  const next = cur ? lines[i + 1] : i >= 0 ? lines[i] : null;
  $("k-cue").textContent = cur && now < cur.start ? T.ready : "";
  $("k-now").innerHTML = cur ? cur.tokens.map((t) => `<span class="${now >= t.end ? "sung" : now >= t.start ? "singing" : ""}">${esc(t.text)}</span>`).join(cur.tokens.every((t) => [...t.text].length === 1) ? "" : " ") : "";
  $("k-next").textContent = next && next !== cur ? next.tokens.map((t) => t.text).join(next.tokens.every((t) => [...t.text].length === 1) ? "" : " ") : "";
}

function draw() {
  if (over) return;
  karaoke();
  requestAnimationFrame(draw);
  if (!view) return;
  const dpr = window.devicePixelRatio || 1;
  const now = view.position + (performance.now() - at) / 1000;
  const W = $("tl").clientWidth;
  const labelW = 110, meterW = 70, x0 = labelW, x1 = W - meterW - 10;
  const span = 60, from = now - span * 0.3, px = (x1 - x0) / span;
  const X = (s) => x0 + (s - from) * px;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const accent = css("--accent"), accent2 = css("--accent-2"), dim = css("--dim"), faint = css("--faint"), line = css("--line");
  const segs = view.timeline.segments.filter((s) => s.end >= from && s.start <= from + span);
  // 在看得见的段里演奏的轨排在前面（原来的顺序），其余的排到后面、变暗。
  const active = new Set(segs.flatMap((s) => s.tracks));
  const all = view.tracks.map((t) => t.name);
  const tracks = [...all.filter((n) => active.has(n)), ...all.filter((n) => !active.has(n))];
  const setup = (cv, H) => {
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px"; }
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    g.font = "12px ui-sans-serif, system-ui, sans-serif"; g.textBaseline = "middle";
    return g;
  };
  const marks = (g, H) => {
    const q = X(view.timeline.queued_until);
    if (q > x0 && q < x1) { g.strokeStyle = accent; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(q, 0); g.lineTo(q, H); g.stroke(); g.setLineDash([]); }
    const n = X(now);
    g.strokeStyle = "#fff"; g.lineWidth = 2; g.beginPath(); g.moveTo(n, 0); g.lineTo(n, H); g.stroke(); g.lineWidth = 1;
  };
  // 标尺：每一段（小节号、拍号、名字）。
  const top = 38, gr = setup($("ruler"), top);
  for (const s of segs) {
    const a = Math.max(x0, X(s.start)), b = Math.min(x1, X(s.end));
    if (b <= a) continue;
    gr.fillStyle = s.repeat ? "rgba(138,125,255,.18)" : "rgba(114,229,194,.22)";
    gr.fillRect(a, 6, b - a - 2, 24);
    gr.fillStyle = s.repeat ? accent2 : accent;
    const label = `${s.bar}${s.meter[0] !== 4 || s.meter[1] !== 4 ? ` · ${s.meter[0]}/${s.meter[1]}` : ""}${!s.repeat && s.name ? ` · ${s.name}` : ""}`;
    if (b - a > 36) { gr.save(); gr.beginPath(); gr.rect(a, 6, b - a - 4, 24); gr.clip(); gr.fillText(label, a + 6, 18); gr.restore(); }
  }
  marks(gr, top);
  // 轨道行（可滚动）：主输出在最上面一行，之后是各轨。
  const rowH = 26, names = ["", ...tracks], H = rowH * names.length + 6, g = setup($("tl"), H);
  const levels = Object.fromEntries((view.levels || []).map(([n, p]) => [n, p]));
  names.forEach((name, i) => {
    const y = i * rowH;
    if (name) for (const s of segs) {
      if (!s.tracks.includes(name)) continue;
      const a = Math.max(x0, X(s.start)), b = Math.min(x1, X(s.end));
      if (b <= a) continue;
      g.fillStyle = s.repeat ? "rgba(138,125,255,.32)" : "rgba(114,229,194,.45)";
      g.fillRect(a, y + 5, b - a - 2, rowH - 10);
    }
    g.strokeStyle = line; g.beginPath(); g.moveTo(0, y + rowH - .5); g.lineTo(W, y + rowH - .5); g.stroke();
    g.fillStyle = !name ? faint : active.has(name) ? dim : faint; g.fillText(name || T.master, 8, y + rowH / 2, labelW - 14);
    const p = levels[name] || 0, db = p > 0 ? 20 * Math.log10(p) : -90, w = Math.max(0, Math.min(1, (db + 60) / 60)) * meterW;
    g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(W - meterW - 4, y + 8, meterW, rowH - 16);
    g.fillStyle = db > -1 ? css("--err") : db > -9 ? css("--warn") : accent; g.fillRect(W - meterW - 4, y + 8, w, rowH - 16);
  });
  marks(g, H);
}
applyLanguage(); poll(); draw();
</script>
</body>
</html>
