[package]
name = "muser-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "muser 接口层：AI/用户通过 CLI 驱动引擎（render 等命令）"

[[bin]]
name = "muser"
path = "src/main.rs"

[dependencies]
muser-core = { workspace = true }
muser-engine = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = "=0.12.0"

[features]
default = ["device", "host"]
## 插件宿主：加载第三方 CLAP/VST3/LV2 乐器与效果器，默认启用（所有发行版都带）。
host = ["muser-engine/host"]
## 本机声卡播放（muser view --device），默认启用。Linux 上需要 ALSA 开发包（libasound2-dev）；
## 不要时：--no-default-features --features muser-cli/host,muser-mcp/host（保留插件宿主）。
device = ["muser-engine/devices"]

[lints]
workspace = true
