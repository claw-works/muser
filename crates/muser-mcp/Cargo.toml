[package]
name = "muser-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "muser MCP server：把引擎能力暴露为 AI agent 可调用的 tools"

[[bin]]
name = "muser-mcp"
path = "src/main.rs"

[dependencies]
muser-core = { workspace = true }
muser-engine = { workspace = true }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
anyhow = { workspace = true }

[features]
default = []
## 插件宿主：外置 VST3/CLAP/LV2 乐器与效果器、插件扫描与参数工具。
host = ["muser-engine/host"]
