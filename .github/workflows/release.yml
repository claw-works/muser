name: Release

# 推送 v* 标签（如 v0.1.0）时构建三平台二进制并发布到 GitHub Release；
# 手动运行（workflow_dispatch）只构建、上传为 Actions 产物，不发布。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }}${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 用 cargo-zigbuild 按 glibc 2.28 链接（runner 自己是 2.35），老一些的发行版也能跑：
          # Amazon Linux 2023、RHEL / Rocky 8+、Debian 10+、Ubuntu 18.10+。
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz, glibc: "2.28" }
          # 不带声卡播放（--device），不依赖 libasound.so.2：给服务器、Docker 等没有 ALSA 的环境。
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz, glibc: "2.28", variant: -headless, flags: --no-default-features }
          # arm64 用 GitHub 的原生 arm runner 构建（不用交叉编译 ALSA，冒烟测试也在 arm64 上跑）。
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz, glibc: "2.28" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz, glibc: "2.28", variant: -headless, flags: --no-default-features }
          - { os: macos-14, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-14, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # 声卡播放（muser-cli 的 device 特性，默认启用）在 Linux 上需要 ALSA 开发包。
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}${{ matrix.variant }}

      - name: Install cargo-zigbuild
        if: matrix.glibc
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          # 指定 glibc 时用 zigbuild（目标写成 <target>.<glibc>），产物路径与 cargo build 相同。
          if [[ -n "${{ matrix.glibc }}" ]]; then
            build="zigbuild"; target="${{ matrix.target }}.${{ matrix.glibc }}"
            # 系统的 libasound.so 引用了比 2.28 新的 glibc 符号；那些由运行机器上的 glibc 提供，
            # 不让链接器替共享库检查（我们自己的引用仍限制在 2.28 以内，见下一步）。
            export RUSTFLAGS="-C link-arg=-Wl,--allow-shlib-undefined"
          else
            build="build"; target="${{ matrix.target }}"
          fi
          cargo $build --release --locked --target "$target" \
            -p muser-cli -p muser-mcp --features muser-cli/host,muser-mcp/host ${{ matrix.flags }}

      - name: Check glibc floor
        if: matrix.glibc
        shell: bash
        run: |
          for b in muser muser-mcp; do
            need=$(objdump -T "target/${{ matrix.target }}/release/$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$b needs $need"
            [[ "$(printf '%s\n%s\n' "${need#GLIBC_}" "${{ matrix.glibc }}" | sort -V | tail -1)" == "${{ matrix.glibc }}" ]] || { echo "$b 需要 $need，超过 glibc ${{ matrix.glibc }}" >&2; exit 1; }
          done

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          [[ "$version" == v* ]] || version="dev-${GITHUB_SHA::7}"
          name="muser-${version}-${{ matrix.target }}${{ matrix.variant }}"
          mkdir -p "dist/$name"
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/muser$ext" "target/${{ matrix.target }}/release/muser-mcp$ext" "dist/$name/"
          # 给 AI 用的文档与示范工程一起打包（插件画像已编译进二进制）。
          cp -r README.md README.zh-CN.md SKILLS.md TOOLS.md ARCHITECTURE.md skills samples "dist/$name/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/muser"
          "$bin" new -o smoke.muser.json
          "$bin" render smoke.muser.json -o smoke.wav
          test -s smoke.wav
          if [[ "${{ matrix.variant }}" == -headless ]] && ldd "$bin" | grep -q libasound; then
            echo "headless 版不应链接 libasound" >&2; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: muser-${{ matrix.target }}${{ matrix.variant }}
          path: ${{ steps.package.outputs.file }}

  release:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
