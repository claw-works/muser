name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04-arm：aarch64 Linux（C 的 char 是无符号的，能抓到只在这里出错的类型问题）。
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # 声卡播放（muser-cli 的 device 特性，默认启用）在 Linux 上需要 ALSA 开发包。
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # 上面的构建与测试已带插件宿主（muser-cli / muser-mcp 默认启用 host；CI 机器上没装插件，
      # 依赖真实插件的测试会自动跳过）。引擎库本身 host 可选：单独测一遍不带 host 的错误路径。
      - name: Test engine without plugin host
        run: cargo test -p muser-engine --locked

      - name: Smoke test CLI
        shell: bash
        run: |
          cargo run -q --locked -p muser-cli -- new -o smoke.muser.json
          cargo run -q --locked -p muser-cli -- validate smoke.muser.json
          cargo run -q --locked -p muser-cli -- render smoke.muser.json -o smoke.wav
          test -s smoke.wav
