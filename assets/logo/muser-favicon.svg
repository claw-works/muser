  <rect x="74" y="96" width="108" height="78" rx="30" fill="url(#shell)"/>
  <rect x="92" y="112" width="72" height="44" rx="12" fill="#0b0e17"/>
  <!-- 屏幕：花括号里一个音符（用数据写音乐） -->
  <g fill="none" stroke="#72e5c2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 118 Q102 118 102 125 V129 Q102 134 97 134 Q102 134 102 139 V143 Q102 150 110 150"/>
    <path d="M146 118 Q154 118 154 125 V129 Q154 134 159 134 Q154 134 154 139 V143 Q154 150 146 150"/>
