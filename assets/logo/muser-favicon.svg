<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 6 212 212">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8f7a"/><stop offset="1" stop-color="#e5533f"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151a2b"/><stop offset="1" stop-color="#0b0e17"/></linearGradient>
  </defs>
  <rect x="22" y="6" width="212" height="212" rx="48" fill="url(#bg)"/>
  <!-- 手臂（两节，关节是机器人的灯）和钳子 -->
  <g stroke="#e5533f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M82 122 L62 114 L55 94"/>
    <path d="M174 122 L194 114 L201 94"/>
  </g>
  <g fill="#72e5c2"><circle cx="62" cy="114" r="5.5"/><circle cx="194" cy="114" r="5.5"/></g>
  <g fill="url(#shell)" stroke="#c9432f" stroke-width="2.5" stroke-linejoin="round">
    <path transform="translate(54 92) rotate(-26) scale(0.88)" d="M -18 2 C -30 -16, -28 -48, -6 -64 C -10 -54, -8 -42, -1 -31 L 3 -30 C 9 -38, 13 -48, 11 -60 C 30 -44, 27 -16, 16 2 Q -1 10 -18 2 Z"/>
    <path transform="translate(202 92) rotate(26) scale(0.88)" d="M -18 2 C -30 -16, -28 -48, -6 -64 C -10 -54, -8 -42, -1 -31 L 3 -30 C 9 -38, 13 -48, 11 -60 C 30 -44, 27 -16, 16 2 Q -1 10 -18 2 Z"/>
