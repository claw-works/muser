  <circle cx="108" cy="62" r="13" fill="#0b0e17" stroke="#e5533f" stroke-width="5"/><circle cx="148" cy="62" r="13" fill="#0b0e17" stroke="#e5533f" stroke-width="5"/>
  <circle cx="108" cy="62" r="6" fill="#72e5c2"/><circle cx="148" cy="62" r="6" fill="#72e5c2"/>
