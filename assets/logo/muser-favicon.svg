  <ellipse cx="124" cy="143" rx="7" ry="5.2" transform="rotate(-20 124 143)" fill="#72e5c2"/>
  <path d="M130 141 V120 Q138 124 140 132" fill="none" stroke="#72e5c2" stroke-width="3.6" stroke-linecap="round"/>
