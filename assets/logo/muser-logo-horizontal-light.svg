<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <rect width="900" height="300" fill="#f3f5fb"/>
  <svg x="40" y="22" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8f7a"/><stop offset="1" stop-color="#e5533f"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151a2b"/><stop offset="1" stop-color="#0b0e17"/></linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- 腿（机械关节），每边 4 条 -->
  <g stroke="#e5533f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M86 150 L52 150 L36 170"/><path d="M170 150 L204 150 L220 170"/><path d="M84 160 L50 168 L36 192"/><path d="M172 160 L206 168 L220 192"/><path d="M88 170 L58 188 L46 212"/><path d="M168 170 L198 188 L210 212"/><path d="M94 178 L70 204 L62 226"/><path d="M162 178 L186 204 L194 226"/>
  </g>
  <g fill="#72e5c2"><circle cx="52" cy="150" r="4.5"/><circle cx="204" cy="150" r="4.5"/><circle cx="50" cy="168" r="4.5"/><circle cx="206" cy="168" r="4.5"/><circle cx="58" cy="188" r="4.5"/><circle cx="198" cy="188" r="4.5"/><circle cx="70" cy="204" r="4.5"/><circle cx="186" cy="204" r="4.5"/></g>
  <!-- 手臂（两节，关节是机器人的灯）和钳子 -->
  <g stroke="#e5533f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M82 122 L62 114 L55 94"/>
    <path d="M174 122 L194 114 L201 94"/>
  </g>
  <g fill="#72e5c2"><circle cx="62" cy="114" r="5.5"/><circle cx="194" cy="114" r="5.5"/></g>
  <g fill="url(#shell)" stroke="#c9432f" stroke-width="2.5" stroke-linejoin="round">
    <path transform="translate(54 92) rotate(-26) scale(0.88)" d="M -18 2 C -30 -16, -28 -48, -6 -64 C -10 -54, -8 -42, -1 -31 L 3 -30 C 9 -38, 13 -48, 11 -60 C 30 -44, 27 -16, 16 2 Q -1 10 -18 2 Z"/>
    <path transform="translate(202 92) rotate(26) scale(0.88)" d="M -18 2 C -30 -16, -28 -48, -6 -64 C -10 -54, -8 -42, -1 -31 L 3 -30 C 9 -38, 13 -48, 11 -60 C 30 -44, 27 -16, 16 2 Q -1 10 -18 2 Z"/>
  </g>
  <g fill="none" stroke="#ffb3a3" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path transform="translate(54 92) rotate(-26) scale(0.88)" d="M -15 -6 C -21 -20, -20 -38, -9 -52"/>
    <path transform="translate(202 92) rotate(26) scale(0.88)" d="M 15 -6 C 21 -20, 20 -38, 11 -50"/>
  </g>
  <!-- 眼柄 + 机器人眼 -->
  <g stroke="#e5533f" stroke-width="7" stroke-linecap="round"><path d="M108 98 V70"/><path d="M148 98 V70"/></g>
  <circle cx="108" cy="62" r="13" fill="#0b0e17" stroke="#e5533f" stroke-width="5"/><circle cx="148" cy="62" r="13" fill="#0b0e17" stroke="#e5533f" stroke-width="5"/>
  <circle cx="108" cy="62" r="6" fill="#72e5c2"/><circle cx="148" cy="62" r="6" fill="#72e5c2"/>
  <!-- 身体：机器人外壳，正面是音箱/均衡器 -->
  <rect x="74" y="96" width="108" height="78" rx="30" fill="url(#shell)"/>
  <rect x="92" y="112" width="72" height="44" rx="12" fill="#0b0e17"/>
  <!-- 屏幕：花括号里一个音符（用数据写音乐） -->
  <g fill="none" stroke="#72e5c2" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 118 Q102 118 102 125 V129 Q102 134 97 134 Q102 134 102 139 V143 Q102 150 110 150"/>
    <path d="M146 118 Q154 118 154 125 V129 Q154 134 159 134 Q154 134 154 139 V143 Q154 150 146 150"/>
  </g>
  <ellipse cx="124" cy="143" rx="7" ry="5.2" transform="rotate(-20 124 143)" fill="#72e5c2"/>
  <path d="M130 141 V120 Q138 124 140 132" fill="none" stroke="#72e5c2" stroke-width="3.6" stroke-linecap="round"/>
</svg>
  <text x="330" y="196" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="150" letter-spacing="-3" fill="#080a11">muser</text>
</svg>
